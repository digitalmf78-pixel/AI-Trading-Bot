name: Seed Persistent NSE Delivery Cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-delivery-cache-seed-main
  cancel-in-progress: false

jobs:
  seed-delivery-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Restore and persist the same NSE cache used by the EOD scanner
        uses: actions/cache@v5
        with:
          # This path list must remain identical to nse-test-scheduled.yml.
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/sector_constituents/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
            data/inputs/fundamental_metrics.csv
            data/cache/fundamental_history/
            data/cache/xbrl_samples/
            data/cache/xbrl_period_pairs/
            outputs/v8_official_financial_results_filings.csv
          key: nse-bhavcopy-${{ runner.os }}-main-delivery-seed-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-main-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backfill dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Verify existing price cache and seed missing Delivery reports
        run: |
          set -euo pipefail
          PRICE_COUNT=$(find data/bhavcopy -maxdepth 1 -type f -name 'bhavcopy_????????.csv' 2>/dev/null | wc -l || true)
          echo "RESTORED_PRICE_CACHE_FILES=$PRICE_COUNT"
          if [ "$PRICE_COUNT" -lt 200 ]; then
            echo "::error::Main NSE price cache has fewer than 200 sessions; refusing to download or modify price Bhavcopy."
            exit 1
          fi
          python -u delivery_history_backfill.py --sessions 200
          cat outputs/delivery_history_backfill/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("outputs/delivery_history_backfill/summary.json").read_text())
          if summary.get("Status") != "COMPLETE" or summary.get("ValidDeliveryReports") != 200:
              raise SystemExit("Delivery cache seed incomplete; refusing successful completion.")
          if summary.get("PriceCacheModified") is not False:
              raise SystemExit("Price Bhavcopy cache must remain unchanged.")
          print("DELIVERY_CACHE_SEED=PASS")
          PY

      - name: Report persistent cache coverage
        if: always()
        run: |
          echo "Delivery cache files:"
          find data/cache/delivery -maxdepth 1 -type f -name 'sec_bhavdata_full_????????.csv' 2>/dev/null | wc -l || true
          if [ -f outputs/delivery_history_backfill/summary.json ]; then
            cat outputs/delivery_history_backfill/summary.json
          fi
