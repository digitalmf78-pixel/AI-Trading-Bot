name: Research-only Fundamental Cache Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_fundamental_cache_audit.py"
      - "test_research_fundamental_cache_audit.py"
      - ".github/workflows/research-fundamental-cache-audit.yml"
      - "data/inputs/fundamental_metrics.csv"
      - "data/cache/fundamental_history/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-fundamental-cache-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip pandas pytest
      - name: Run read-only inventory tests
        run: python -m pytest -q test_research_fundamental_cache_audit.py
      - name: Inventory persisted fundamental cache
        run: python -u scripts/research_fundamental_cache_audit.py
      - name: Upload cache inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: research-fundamental-cache-inventory-${{ github.run_id }}
          path: outputs/research_fundamental_cache_audit/
          if-no-files-found: error
