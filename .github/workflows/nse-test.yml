
name: NSE Data Test

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: Send report to configured Telegram chat
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nse-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore Bhavcopy and Nifty history cache
        uses: actions/cache@v5
        with:
          path: data/bhavcopy/
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Check repository files
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== REPOSITORY FILES ====="
          ls -lah

          echo "===== REQUIRED PYTHON FILES ====="
          for f in volume_gainer.py v8_layers_14_41.py news_catalyst.py; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done

          echo "===== PYTHON VERSION ====="
          python --version

      - name: Run NSE Volume Gainer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: ${{ inputs.send_telegram }}
        run: |
          set -e

          echo "===== PYTHON COMPILE CHECK ====="
          python -m py_compile volume_gainer.py
          python -m py_compile v8_layers_14_41.py
          python -m py_compile news_catalyst.py
          echo "Compile check PASSED"

          echo "===== STARTING NSE SCANNER ====="
          python -u ./volume_gainer.py
          echo "===== NSE SCANNER FINISHED ====="

      - name: Diagnose NSE V8 data files
        if: always()
        run: |
          echo "===== INPUT CSV FILES ====="

          if [ -d data/inputs ]; then
            find data/inputs -maxdepth 1 -type f -name "*.csv" \
              -print -exec wc -l {} \;

            for f in data/inputs/*.csv; do
              if [ -f "$f" ]; then
                echo ""
                echo "===== FILE: $f ====="
                echo "--- First 3 lines ---"
                head -3 "$f"
              fi
            done
          else
            echo "data/inputs directory does not exist"
          fi

          echo ""
          echo "===== OUTPUT FILES ====="

          if [ -d outputs ]; then
            find outputs -maxdepth 3 -type f -print
          else
            echo "outputs directory does not exist"
          fi

          echo ""
          echo "===== BHAVCOPY CACHE FILES ====="

          if [ -d data/bhavcopy ]; then
            find data/bhavcopy -maxdepth 3 -type f -print | head -100
          else
            echo "data/bhavcopy directory does not exist"
          fi

      - name: Upload NSE V8 reports and diagnostic files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nse-v8-reports-${{ github.run_id }}
          path: |
            outputs/
            data/inputs/*.csv
          if-no-files-found: warn
