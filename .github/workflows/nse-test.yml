name: NSE Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nse-data-test:
    name: NSE API Diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Compile Python Modules
        run: |
          python -m py_compile nse_bhavcopy_test.py
          python -m py_compile volume_gainer.py
          python -m py_compile delivery_filter.py
          python -m py_compile news_catalyst.py
          python -m py_compile v8_layers_14_41.py

      - name: Run NSE Test and Save Diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          python -u nse_bhavcopy_test.py 2>&1 | tee diagnostics/nse-test.log
          result=${PIPESTATUS[0]}
          echo "NSE test exit code: ${result}" | tee -a diagnostics/nse-test.log
          exit "$result"

      - name: Upload NSE Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-data-test-diagnostics
          path: diagnostics/nse-test.log
          if-no-files-found: warn
          retention-days: 7
```
