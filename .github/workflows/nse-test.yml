name: NSE Data Test

on:
  workflow_dispatch:

jobs:
  nse-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Check Volume Gainer File
        run: |
          pwd
          echo "----- Repository files -----"
          ls -lh
          echo "----- volume_gainer.py exists? -----"
          ls -lh volume_gainer.py
          echo "----- First 20 lines of volume_gainer.py -----"
          head -20 volume_gainer.py
          echo "----- Python version -----"
          python --version

      - name: Test NSE Volume Gainer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Starting volume_gainer.py..."
          python -u volume_gainer.py
