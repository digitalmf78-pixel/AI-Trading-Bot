name: NSE V8 Regression Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "delivery_filter.py"
      - "news_catalyst.py"
      - "v8_layers_14_41.py"
      - "sector_data.py"
      - "test_v8_regression.py"
      - ".github/workflows/v8-regression.yml"
  pull_request:
    paths:
      - "delivery_filter.py"
      - "news_catalyst.py"
      - "v8_layers_14_41.py"
      - "sector_data.py"
      - "test_v8_regression.py"
      - ".github/workflows/v8-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests
      - name: Compile V8 modules
        run: python -m py_compile delivery_filter.py news_catalyst.py sector_data.py v8_layers_14_41.py
      - name: Run V8 regression tests
        run: python test_v8_regression.py
