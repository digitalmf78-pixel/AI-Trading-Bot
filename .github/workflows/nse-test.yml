name: NSE Data Test

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: Send the report to the configured Telegram chat
        required: false
        type: boolean
        default: false

jobs:
  nse-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Bhavcopy and Nifty history cache
        uses: actions/cache@v4
        with:
          path: data/bhavcopy/
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Check Volume Gainer File
        run: |
          pwd
          echo "----- Repository files -----"
          ls -lh
          echo "----- volume_gainer.py exists? -----"
          ls -lh volume_gainer.py
          echo "----- First 20 lines of volume_gainer.py -----"
          head -20 volume_gainer.py
          echo "----- Python version -----"
          python --version

      - name: Test NSE Volume Gainer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: ${{ inputs.send_telegram }}
        run: |
          echo "===== TEST START ====="
          echo "Current directory:"
          pwd
          echo "Python:"
          python --version
          echo "Checking file:"
          ls -lh volume_gainer.py
          echo "Running compile check..."
          python -m py_compile volume_gainer.py
          echo "Compile check PASSED"
          echo "Starting Python..."
          python -u ./volume_gainer.py
          echo "===== TEST END ====="

      - name: Upload NSE V8 reports and input templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-v8-reports-${{ github.run_id }}
          path: |
            outputs/
            data/inputs/*.csv
          if-no-files-found: warn
