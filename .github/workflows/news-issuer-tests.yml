name: NSE V8 News Issuer Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "news_catalyst.py"
      - "delivery_filter.py"
      - "test_news_issuer_matching.py"
      - "test_delivery_compact_metrics.py"
      - "test_telegram_delivery.py"
      - ".github/workflows/news-issuer-tests.yml"

permissions:
  contents: read

jobs:
  news-issuer-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytest

      - name: Compile changed modules
        run: python -m py_compile news_catalyst.py delivery_filter.py

      - name: Run issuer matching regression tests
        run: python -m unittest -v test_news_issuer_matching.py

      - name: Run compact Delivery and Telegram tests
        run: python -m pytest -q test_delivery_compact_metrics.py test_telegram_delivery.py
