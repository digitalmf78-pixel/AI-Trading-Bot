name: NSE V8 T1 T2 Research Data Readiness

on:
  push:
    branches:
      - research/nse-v8-t1-t2-data-readiness-2026-11-17
    paths:
      - 't1_t2_data_readiness.py'
      - 'test_t1_t2_data_readiness.py'
      - '.github/workflows/nse-v8-t1-t2-readiness.yml'
  pull_request:
    paths:
      - 't1_t2_data_readiness.py'
      - 'test_t1_t2_data_readiness.py'
      - '.github/workflows/nse-v8-t1-t2-readiness.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Historical EOD workflow run ID containing v8_eod_watchlist.csv
        required: true
        default: "42830154736"

permissions:
  actions: read
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5

      - name: Restore existing NSE cache read-only
        uses: actions/cache/restore@v5
        with:
          path: |
            data/bhavcopy/
            data/cache/delivery/
          key: nse-bhavcopy-${{ runner.os }}-main-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-main-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Download archived EOD report artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '42830154736' }}
        run: |
          mkdir -p research_inputs/eod_artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "nse-v8-reports-$SOURCE_RUN_ID" \
            --dir research_inputs/eod_artifact
          test -s research_inputs/eod_artifact/outputs/v8_eod_watchlist.csv

      - name: Compile and test research audit
        run: |
          python -m py_compile t1_t2_data_readiness.py
          python -m unittest -v test_t1_t2_data_readiness

      - name: Audit archived EOD signals against read-only cache
        run: |
          python t1_t2_data_readiness.py \
            --signals research_inputs/eod_artifact/outputs/v8_eod_watchlist.csv

      - name: Report restored cache inventory
        if: always()
        run: |
          echo "BHAVCOPY_FILE_COUNT=$(find data/bhavcopy -maxdepth 1 -type f -name 'bhavcopy_*.csv' 2>/dev/null | wc -l)"
          echo "DELIVERY_FILE_COUNT=$(find data/cache/delivery -maxdepth 1 -type f -name 'sec_bhavdata_full_*.csv' 2>/dev/null | wc -l)"

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-v8-t1-t2-readiness-${{ github.run_id }}
          path: |
            outputs/t1_t2_readiness/
          if-no-files-found: warn
          retention-days: 30
