```yaml
name: News Matching Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-matching-tests:
    name: Issuer-aware News Matching
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas pytest

      - name: Check required files
        run: |
          test -f news_catalyst.py
          test -f test_news_catalyst_matching.py

      - name: Compile news module and tests
        run: |
          python -m py_compile news_catalyst.py
          python -m py_compile test_news_catalyst_matching.py

      - name: Run issuer-aware news matching tests
        run: |
          python -m pytest -q test_news_catalyst_matching.py
```
