name: NSE Data Test

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "EOD scan or next-session premarket news refresh"
        required: true
        type: choice
        default: EOD
        options:
          - EOD
          - PREMARKET
  # Run an EOD validation when the workflow or fundamental data-provider
  # pipeline changes. Scanner/cache commits do not touch these source paths,
  # so the persistence step cannot recursively start another scan.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nse-test-scheduled.yml"
      - "fundamental_data_provider.py"
      - "free_fundamental_sources.py"
      - "nse_shareholding.py"
      - "nse_xbrl_fetch.py"
      - "fundamental_official_filings.py"
      - "fundamental_metric_verification.py"
      - "delivery_cache_manager.py"
      - "delivery_history_backfill.py"
      - "delivery_filter.py"
      - "delivery_ab_history_cache.py"
      - "test_delivery_ab_history_cache.py"
      - "test_delivery_cache_manager.py"
      - "test_delivery_history_backfill.py"
      - "test_v8_regression.py"
      - "test_rsi_retest_existing_cache.py"
      - "sector_data.py"
      - "test_nse_official_index_api.py"
      - "news_catalyst.py"
      - "test_news_catalyst_matching.py"
      - "test_news_issuer_matching.py"
      - "test_news_official_feed_diagnostics.py"
      - "potential_accumulation_analysis.py"
      - "test_potential_accumulation_analysis.py"
  schedule:
    # 16:40 UTC = 22:10 IST: EOD scan after NSE data is usually available.
    - cron: "40 16 * * 1-5"
    # 02:30 UTC = 08:00 IST: premarket refresh.
    - cron: "30 2 * * 1-5"

concurrency:
  group: nse-data-test-${{ github.ref }}
  # Code pushes supersede a stale in-flight scan; scheduled runs do not cancel each other.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  nse-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore NSE, delivery, and sector history caches
        uses: actions/cache@v5
        with:
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/sector_constituents/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
            data/inputs/fundamental_metrics.csv
            data/cache/fundamental_history/
            data/cache/xbrl_samples/
            data/cache/xbrl_period_pairs/
            data/cache/shareholding_xbrl/
            outputs/v8_official_financial_results_filings.csv
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-
            nse-bhavcopy-${{ runner.os }}-main-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit restored official NSE Bhavcopy cache coverage
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          import pandas as pd
          from nse_trading_calendar import CalendarCoverageError, is_trading_session
          from volume_gainer import validate_bhavcopy_date

          root = Path("data/bhavcopy")
          files = sorted(root.glob("bhavcopy_????????.csv")) if root.exists() else []
          parsed = {}
          invalid = []
          non_sessions = []
          for path in files:
              try:
                  day = datetime.strptime(path.stem.removeprefix("bhavcopy_"), "%Y%m%d").date()
                  if not is_trading_session(day):
                      non_sessions.append((day.isoformat(), path.name))
                      continue
                  frame = pd.read_csv(path)
                  validate_bhavcopy_date(frame, day, source=f"Cache audit {path}")
                  parsed[day] = path
              except CalendarCoverageError:
                  raise
              except Exception as exc:
                  invalid.append((path.name, str(exc)))

          print(f"BHAVCOPY_CACHE_FILES={len(files)}")
          print(f"BHAVCOPY_CACHE_VALID_OFFICIAL_SESSION_FILES={len(parsed)}")
          print(f"BHAVCOPY_CACHE_INVALID_FILES={len(invalid)}")
          print(f"BHAVCOPY_CACHE_NON_SESSION_FILES={len(non_sessions)}")
          if parsed:
              latest = max(parsed)
              oldest = min(parsed)
              print(f"BHAVCOPY_CACHE_DATE_RANGE={oldest.isoformat()}..{latest.isoformat()}")
              required = []
              cursor = latest - timedelta(days=1)
              while len(required) < 200 and (latest - cursor).days <= 320:
                  if is_trading_session(cursor):
                      required.append(cursor)
                  cursor -= timedelta(days=1)
              missing = [day.isoformat() for day in required if day not in parsed]
              print(f"BHAVCOPY_PRIOR_SESSION_CACHE_COVERAGE={len(required)-len(missing)}/200")
              print(f"BHAVCOPY_PRIOR_SESSION_MISSING={','.join(missing[:25]) if missing else 'NONE'}")
          else:
              print("BHAVCOPY_CACHE_STATUS=EMPTY; scanner will attempt official-session gap fill")
          if invalid:
              print("BHAVCOPY_CACHE_INVALID_SAMPLE=" + repr(invalid[:10]))
          if non_sessions:
              print("BHAVCOPY_CACHE_NON_SESSION_SAMPLE=" + repr(non_sessions[:10]))
          PY

      - name: Audit restored 30-day NSE Delivery cache coverage
        run: |
          python -u delivery_cache_manager.py

      - name: Check repository files
        run: |
          echo "===== REQUIRED PYTHON FILES ====="
          for f in track2_full_mainboard.py potential_accumulation_analysis.py vcp_observation_analysis.py delivery_quantity_analysis.py volume_gainer.py main_board_filter.py v8_layers_14_41.py news_catalyst.py telegram_research_digest.py sector_data.py delivery_filter.py nse_trading_calendar.py data/inputs/nse_trading_calendar.json delivery_streak_tracker.py delivery_cache_manager.py delivery_history_backfill.py  liquidity_filter.py fundamental_filter.py fundamental_data_provider.py free_fundamental_sources.py nse_shareholding.py fundamental_shortlist.py fundamental_official_filings.py fundamental_metric_verification.py fii_dii_activity.py risk_controls.py sanitize_public_artifacts.py nse_xbrl_fetch.py nse_xbrl_sample_diagnostic.py nse_xbrl_financial_fact_audit.py nse_xbrl_statement_reconciliation.py nse_xbrl_ytd_cashflow_reconciliation.py; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "===== FUNDAMENTAL THRESHOLD CONFIG ====="
          python - <<'PY'
          from fundamental_shortlist import _load_explicit_thresholds
          thresholds, error = _load_explicit_thresholds()
          if error:
              print(f"FUNDAMENTAL_THRESHOLDS_PREFLIGHT=WAIT_FOR_DATA:{error}")
              print("Observation reports may run; fundamental PASS remains unavailable and no stock may be promoted on guessed defaults.")
          else:
              print(f"FUNDAMENTAL_THRESHOLDS_PREFLIGHT=PASS keys={len(thresholds)}")
          PY
          python --version

      - name: Run NSE V8 compile and regression tests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: "false"
        run: |
          set -e
          echo "===== PYTHON COMPILE CHECK ====="
          python -m py_compile delivery_ab_history_cache.py track2_full_mainboard.py potential_accumulation_analysis.py vcp_observation_analysis.py delivery_quantity_analysis.py volume_gainer.py main_board_filter.py v8_layers_14_41.py news_catalyst.py sector_data.py delivery_filter.py nse_trading_calendar.py delivery_streak_tracker.py  liquidity_filter.py fundamental_filter.py fundamental_data_provider.py fundamental_shortlist.py fundamental_official_filings.py fundamental_metric_verification.py fii_dii_activity.py risk_controls.py sanitize_public_artifacts.py nse_xbrl_fetch.py nse_xbrl_sample_diagnostic.py nse_xbrl_financial_fact_audit.py nse_xbrl_statement_reconciliation.py nse_xbrl_ytd_cashflow_reconciliation.py nse_bhavcopy_test.py nifty500_api_test.py

          echo "===== MAIN BOARD / BHAVCOPY CACHE REUSE TESTS ====="
          python -m pytest -q test_main_board_filter.py test_bhavcopy_history_cache_reuse.py
          echo "===== DELIVERY / LIQUIDITY / FUNDAMENTAL / PIPELINE TESTS ====="
          python -m pytest -q test_delivery_rule.py test_delivery_filter_fallback.py test_delivery_cache_manager.py test_delivery_ab_history_cache.py test_rsi_retest_existing_cache.py test_liquidity_filter.py test_fundamental_filter.py test_fundamental_data_provider.py test_free_fundamental_sources.py test_nse_shareholding.py test_telegram_delivery.py test_fundamental_shortlist_and_alignment.py test_fundamental_official_filings.py test_fundamental_fail_closed.py test_top50_rvol_selection.py test_risk_controls.py test_audit_risk_fixes.py test_selection_pipeline_order.py test_fundamental_cache_persistence_workflow.py test_fundamental_metric_verification.py test_fii_dii_activity.py test_sanitize_public_artifacts.py

          echo "===== P2 CASH FLOW BASIS + NSE XBRL FETCH TESTS ====="
          python -m pytest -q test_nse_xbrl_fetch.py test_nse_xbrl_sample_diagnostic.py test_nse_xbrl_financial_fact_audit.py test_nse_xbrl_statement_reconciliation.py test_nse_xbrl_ytd_cashflow_reconciliation.py test_fundamental_data_provider.py test_fundamental_shortlist_and_alignment.py test_fundamental_official_filings.py

          echo "===== TRACK 2 FULL MAINBOARD OBSERVER TESTS ====="
          python -m pytest -q test_track2_full_mainboard.py test_track2_data_quality_diagnostics.py test_potential_accumulation_analysis.py test_vcp_observation_analysis.py test_delivery_quantity_analysis.py

          echo "===== V8 REGRESSION TESTS ====="
          python -u test_v8_regression.py

          echo "===== SECTOR / NEWS / CACHE UNIT TESTS ====="
          python -u -m unittest -v \
            test_sector_news_final_fix \
            test_sector_mapping_cache_reconciliation \
            test_niftyindices_history_bootstrap \
            test_news_official_feed_diagnostics \
            test_news_catalyst_matching \
            test_news_issuer_matching \
            test_nse_official_index_api

          echo "===== PYTEST PARSER TESTS ====="
          python -m pytest -q test_news_catalyst_parser.py
          echo "===== UPCOMING CORPORATE EVENTS TESTS ====="
          python -m pytest -q test_upcoming_corporate_events.py

      - name: Diagnose official NSE DNS reachability (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          python - <<'PYDNS'
          import socket
          hosts = ("nsearchives.nseindia.com", "www.nseindia.com")
          for host in hosts:
              try:
                  rows = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  ips = sorted({row[4][0] for row in rows})
                  print(f"NSE_DNS_STATUS=PASS HOST={host} IPS={','.join(ips)}")
              except OSError as exc:
                  print(f"NSE_DNS_STATUS=FAIL HOST={host} ERROR={type(exc).__name__}:{exc}")
          PYDNS

      - name: Restore durable signal history before EOD scan
        if: github.event.schedule != '30 2 * * 1-5' && inputs.scan_mode != 'PREMARKET'
        run: |
          set -euo pipefail
          python -u signal_history_persistence.py restore

      - name: Run NSE Volume Gainer
        id: nse_scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: "true"
          RISK_CONFIG_JSON: ${{ secrets.RISK_CONFIG_JSON }}
          # Adapter uses bounded 4s connect / 8s read timeouts and disables retries.
          V8_FREE_FUNDAMENTAL_SOURCES: "true"
          FREE_FUNDAMENTAL_MAX_SYMBOLS_PER_RUN: "10"
          FREE_FUNDAMENTAL_RETRY_DAYS: "7"
          NEWS_SCAN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5' && 'PREMARKET' || inputs.scan_mode || 'EOD' }}
        run: |
          set -e
          echo "===== NEWS SCAN MODE: ${NEWS_SCAN_MODE} ====="
          python -u ./volume_gainer.py
          echo "===== NSE SCANNER FINISHED ====="

      - name: Notify Telegram when any NSE workflow step fails
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5' && 'PREMARKET' || inputs.scan_mode || 'EOD' }}
        run: |
          python - <<'PY'
          import os, sys, time, requests
          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              print("Telegram failure alert unavailable: configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets.")
              sys.exit(1)
          message = ("❌ NSE V8 scan FAILED\n"
                     f"Mode: {os.getenv('SCAN_MODE', 'UNKNOWN')}\n"
                     f"Repository: {os.getenv('GITHUB_REPOSITORY', 'unknown')}\n"
                     f"Run: {os.getenv('GITHUB_SERVER_URL', 'https://github.com')}/{os.getenv('GITHUB_REPOSITORY', '')}/actions/runs/{os.getenv('GITHUB_RUN_ID', '')}\n"
                     "GitHub Actions logs तपासा.")
          error = None
          for attempt in range(1, 4):
              try:
                  response = requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": message}, timeout=25)
                  response.raise_for_status()
                  payload = response.json()
                  if payload.get("ok") is not True:
                      raise RuntimeError(f"Telegram API rejected alert: {payload}")
                  print(f"Failure alert delivered. message_id={payload.get('result', {}).get('message_id')}")
                  error = None
                  break
              except Exception as exc:
                  error = exc
                  print(f"Failure alert attempt {attempt}/3 failed: {exc}")
                  if attempt < 3:
                      time.sleep(2 ** attempt)
          if error:
              raise error
          PY

      - name: Fetch and inspect up to five official NSE XBRL samples (diagnostic only)
        id: xbrl_diagnostic
        # Run even if the separate signal-history push failed; scanner success remains required.
        if: always() && steps.nse_scan.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          python -u nse_xbrl_sample_diagnostic.py --limit 5
          echo "===== XBRL SAMPLE DIAGNOSTIC SUMMARY ====="
          if [ -f outputs/xbrl_sample_diagnostics/xbrl_sample_diagnostic_summary.csv ]; then
            cat outputs/xbrl_sample_diagnostics/xbrl_sample_diagnostic_summary.csv
          fi

      - name: Extract official NSE XBRL financial fact candidates (audit only)
        if: steps.xbrl_diagnostic.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          python -u nse_xbrl_financial_fact_audit.py
          echo "===== XBRL FINANCIAL FACT AUDIT SUMMARY ====="
          if [ -f outputs/xbrl_financial_fact_audit/xbrl_financial_fact_audit_summary.csv ]; then
            cat outputs/xbrl_financial_fact_audit/xbrl_financial_fact_audit_summary.csv
          fi

      - name: Reconcile official NSE XBRL statement arithmetic (audit only)
        if: steps.xbrl_diagnostic.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          python -u nse_xbrl_statement_reconciliation.py
          echo "===== XBRL STATEMENT RECONCILIATION SUMMARY ====="
          if [ -f outputs/xbrl_statement_reconciliation/xbrl_statement_reconciliation_summary.csv ]; then
            cat outputs/xbrl_statement_reconciliation/xbrl_statement_reconciliation_summary.csv
          fi
          echo "===== XBRL STATEMENT RECONCILIATION CHECKS ====="
          if [ -f outputs/xbrl_statement_reconciliation/xbrl_statement_reconciliation_checks.csv ]; then
            cat outputs/xbrl_statement_reconciliation/xbrl_statement_reconciliation_checks.csv
          fi

      - name: Audit every cached fundamental metric against hashed official NSE XBRL evidence
        if: steps.nse_scan.outcome == 'success'
        run: |
          set -e
          python -u fundamental_metric_verification.py
          echo "===== FUNDAMENTAL METRIC VERIFICATION SUMMARY ====="
          if [ -f outputs/v8_fundamental_metric_verification_summary.csv ]; then
            cat outputs/v8_fundamental_metric_verification_summary.csv
          fi
          if [ -f outputs/v8_fundamental_filing_metadata_summary.csv ]; then
            cat outputs/v8_fundamental_filing_metadata_summary.csv
          fi
          echo "===== FUNDAMENTAL METRIC VERIFICATION SAMPLE ====="
          if [ -f outputs/v8_fundamental_metric_verification.csv ]; then
            head -12 outputs/v8_fundamental_metric_verification.csv
          fi

      - name: Audit Q4 CFO using matched annual and 9M official NSE XBRL filings (candidate only)
        if: steps.nse_scan.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          python -u nse_xbrl_ytd_cashflow_reconciliation.py --limit 5
          echo "===== Q4 CFO ANNUAL / 9M RECONCILIATION SUMMARY ====="
          if [ -f outputs/xbrl_ytd_cashflow_reconciliation/xbrl_ytd_cashflow_reconciliation_summary.csv ]; then
            cat outputs/xbrl_ytd_cashflow_reconciliation/xbrl_ytd_cashflow_reconciliation_summary.csv
          fi
          echo "===== Q4 CFO RECONCILIATION DETAILS ====="
          if [ -f outputs/xbrl_ytd_cashflow_reconciliation/xbrl_ytd_cashflow_reconciliation.csv ]; then
            cat outputs/xbrl_ytd_cashflow_reconciliation/xbrl_ytd_cashflow_reconciliation.csv
          fi

      - name: Run RSI 30/40/50 retest comparison from existing cache
        if: always()
        run: |
          set -e
          echo "===== RSI RETEST BACKTEST (NO NETWORK; unit tests already ran pre-scan) ====="
          python -u rsi_retest_existing_cache.py
          echo "===== RSI RETEST COMPARISON PREVIEW ====="
          if [ -f outputs/rsi_retest/rsi_retest_comparison.csv ]; then cat outputs/rsi_retest/rsi_retest_comparison.csv; fi
          echo "===== CACHE COVERAGE PREVIEW ====="
          if [ -f outputs/rsi_retest/cache_coverage.csv ]; then cat outputs/rsi_retest/cache_coverage.csv; fi

      - name: Run historical RVOL strategy comparison from existing cache
        if: always()
        continue-on-error: true
        run: |
          set -e
          echo "===== RVOL BACKTEST UNIT TESTS ====="
          python -m pytest -q test_rvol_strategy_backtest.py
          echo "===== RVOL STRATEGY BACKTEST (NO NETWORK) ====="
          python -u rvol_strategy_backtest.py
          echo "===== RVOL STRATEGY COMPARISON ====="
          if [ -f outputs/rvol_strategy_backtest/comparison.csv ]; then cat outputs/rvol_strategy_backtest/comparison.csv; fi
          echo "===== RVOL CACHE COVERAGE ====="
          if [ -f outputs/rvol_strategy_backtest/cache_coverage.csv ]; then cat outputs/rvol_strategy_backtest/cache_coverage.csv; fi
          echo "===== RVOL REJECTION COUNTS ====="
          if [ -f outputs/rvol_strategy_backtest/rejection_counts.csv ]; then cat outputs/rvol_strategy_backtest/rejection_counts.csv; fi

      - name: Diagnose NSE V8 data files
        if: always()
        run: |
          echo "===== LAYER STATUS SUMMARY PREVIEW ====="
          if [ -f outputs/v8_layer_status_summary.csv ]; then head -12 outputs/v8_layer_status_summary.csv; else echo "Layer status summary not found"; fi
          echo "===== EOD WATCHLIST PREVIEW ====="
          if [ -f outputs/v8_eod_watchlist.csv ]; then head -6 outputs/v8_eod_watchlist.csv; else echo "EOD watchlist not found"; fi
          echo "===== FUNDAMENTAL COLLECTION REPORTS ====="
          # Only inspect reports that the current Liquidity-first production path emits.
          # Delivery-A/B-specific fundamentals and standalone shortlist exports are not
          # production outputs while the collection-boundary decision remains open.
          echo "NOTE: per-A/B fundamental exports and standalone shortlist files are not expected in the current production path."
          for f in outputs/v8_fundamental_provider_diagnostics.csv outputs/v8_fundamental_report.csv outputs/v8_fundamental_metric_verification.csv outputs/v8_liquidity_technical_fundamental_report.csv outputs/v8_official_financial_results_filings.csv outputs/v8_fii_dii_market_activity.csv; do
            if [ -f "$f" ]; then echo "===== $f (rows excluding header) ====="; python -c "import pandas as pd,sys; p=sys.argv[1]; d=pd.read_csv(p); print('rows=',len(d)); print(d.head(3).to_string(index=False))" "$f"; else echo "EXPECTED REPORT NOT PRODUCED: $f"; fi
          done
          echo "===== SECTOR / DATA REPORTS ====="
          if [ -d data/reports ]; then
            find data/reports -maxdepth 2 -type f -print || true
            for f in data/reports/sector_candidate_mapping_*.csv data/reports/delivery_first_audit_*.csv; do
              if [ -f "$f" ]; then echo "===== $f ====="; head -12 "$f"; fi
            done
          fi
          echo "===== BHAVCOPY CACHE SAMPLE ====="
          if [ -d data/bhavcopy ]; then find data/bhavcopy -maxdepth 1 -type f -name "*.csv" -print 2>/dev/null | head -20 || true; else echo "Bhavcopy cache directory does not exist"; fi

      - name: Backfill and persist the latest 200 official NSE Delivery sessions
        if: steps.nse_scan.outcome == 'success' && github.event.schedule != '30 2 * * 1-5' && inputs.scan_mode != 'PREMARKET'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Uses only already-cached, internally validated Bhavcopy session dates.
          # Fetches missing official Delivery reports; never downloads or edits price Bhavcopy.
          python -u delivery_history_backfill.py --sessions 200
          python - <<'PY'
          from delivery_cache_manager import (
              latest_bhavcopy_date, audit_delivery_cache,
              audit_delivery_history_cache, prune_old_delivery_reports,
          )
          asof = latest_bhavcopy_date()
          if asof is None:
              raise SystemExit("DELIVERY_CACHE_PERSIST=WAIT_FOR_DATA; no validated Bhavcopy as-of date.")
          audit_delivery_cache(asof)  # scanner's independent 30-calendar-day window
          history = audit_delivery_history_cache(target_sessions=200)
          if not history["complete"]:
              raise SystemExit("DELIVERY_HISTORY_PERSIST=WAIT_FOR_DATA; refusing to prune or commit incomplete 200-session history.")
          removed = prune_old_delivery_reports(target_sessions=200)
          print(f"DELIVERY_HISTORY_PRUNED_OUTSIDE_200_SESSIONS={len(removed)}")
          print(f"DELIVERY_HISTORY_VALID_REPORTS_TO_KEEP={len(history['valid_files'])}/200")
          print("DELIVERY_HISTORY_PRICE_BHAVCOPY_MODIFIED=False")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Persist raw official reports and the independent derived A/B snapshot.
          git add -A -f -- data/cache/delivery/
          echo "===== STAGED 200-SESSION DELIVERY CACHE ====="
          git diff --cached --name-status -- data/cache/delivery/
          if git diff --cached --quiet -- data/cache/delivery/; then
            echo "DELIVERY_HISTORY_PERSIST=UNCHANGED"
            exit 0
          fi
          git commit -m "chore: persist 200-session NSE delivery cache"
          git fetch origin "${GITHUB_REF_NAME}"
          git -c rebase.autoStash=true rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Persist append-only signal history in repository
        if: steps.nse_scan.outcome == 'success' && github.event.schedule != '30 2 * * 1-5' && inputs.scan_mode != 'PREMARKET'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          HISTORY="data/signal_history/signal_log.csv"
          SCHEMA="data/signal_history/schema_version.txt"
          if [ ! -f "$SCHEMA" ] || [ "$(tr -d '\r\n' < "$SCHEMA")" != "1.0" ]; then
            echo "[SIGNAL HISTORY] WARNING: schema marker mismatch; durable history not updated."
            exit 0
          fi
          python -u signal_history_persistence.py persist
          mkdir -p data/signal_history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$SCHEMA"
          if [ -f "$HISTORY" ]; then
            git add -f -- "$HISTORY"
          fi
          if [ -f data/signal_history/signal_outcomes.csv ]; then
            git add -f -- data/signal_history/signal_outcomes.csv
          fi
          if git diff --cached --quiet; then
            echo "[SIGNAL HISTORY] No new rows to persist."
            exit 0
          fi
          git commit -m "chore: persist append-only NSE signal history"
          git fetch origin "$GITHUB_REF_NAME"
          # The scanner updates tracked cache/report files in this checkout.
          # Auto-stash those unrelated edits while rebasing the durable-history commit.
          git -c rebase.autoStash=true rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Persist fundamental cache and dated history in repository
        # Run even if the separate signal-history push failed; scanner success remains required.
        if: always() && steps.nse_scan.outcome == 'success'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the current metrics cache and dated snapshots in repository
          # history as requested; these contain public-company fundamentals,
          # not credentials or account-specific secrets.
          echo "===== FUNDAMENTAL HISTORY INVENTORY BEFORE STAGING ====="
          if [ ! -d data/cache/fundamental_history ]; then
            echo "ERROR: data/cache/fundamental_history directory is missing."
            exit 1
          fi
          mapfile -d '' HISTORY_FILES < <( { find data/cache/fundamental_history -maxdepth 1 -type f -name '*.csv' -print0 | sort -z; } 2>/dev/null )
          echo "HISTORY_CSV_COUNT=${#HISTORY_FILES[@]}"
          if [ "${#HISTORY_FILES[@]}" -eq 0 ]; then
            echo "ERROR: no dated fundamental history CSV files were produced."
            exit 1
          fi
          for f in "${HISTORY_FILES[@]}"; do
            echo "HISTORY_FILE=$f"
            sha256sum "$f"
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "HISTORY_TRACKING_STATUS=TRACKED:$f"
            else
              echo "HISTORY_TRACKING_STATUS=NOT_YET_TRACKED:$f"
            fi
          done

          if [ -f data/inputs/fundamental_metrics.csv ]; then
            git add -f data/inputs/fundamental_metrics.csv
          fi
          if [ -f data/inputs/fundamental_metric_verification_evidence.csv ]; then
            git add -f data/inputs/fundamental_metric_verification_evidence.csv
          fi
          for f in "${HISTORY_FILES[@]}"; do
            git add -f -- "$f"
          done
          if [ -f outputs/v8_official_financial_results_filings.csv ]; then
            git add -f outputs/v8_official_financial_results_filings.csv
          fi

          echo "===== STAGED FUNDAMENTAL FILES ====="
          git diff --cached --name-status
          echo "===== STAGED CHANGE SUMMARY ====="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "Fundamental cache and history are already committed and unchanged."
            for f in "${HISTORY_FILES[@]}"; do
              git ls-files --error-unmatch "$f" >/dev/null 2>&1 || { echo "ERROR: history file is not tracked: $f"; exit 1; }
            done
            exit 0
          fi

          git commit -m "chore: persist NSE V8 fundamental cache and history"
          echo "===== COMMITTED FUNDAMENTAL FILES ====="
          git show --format= --name-status HEAD
          # Another workflow or audit-triggering commit may advance the branch
          # while this scan is running. Rebase the cache commit onto that head.
          git fetch origin "${GITHUB_REF_NAME}"
          # Preserve scanner-generated tracked changes while rebasing the cache commit.
          git -c rebase.autoStash=true rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Redact account-derived position sizing from public report artifacts
        id: artifact_redaction
        if: always()
        run: python -u sanitize_public_artifacts.py --root outputs

      - name: Upload NSE V8 reports and input templates
        if: always() && steps.artifact_redaction.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: nse-v8-reports-${{ github.run_id }}
          path: |
            outputs/
            outputs/rsi_retest/
            outputs/xbrl_financial_fact_audit/
            outputs/xbrl_statement_reconciliation/
            data/inputs/*.csv
            data/inputs/fundamental_thresholds.json
            data/inputs/*.json
            !data/inputs/risk_config.json
            data/reports/
            data/cache/fundamental_history/
            data/cache/xbrl_samples/
          if-no-files-found: warn

