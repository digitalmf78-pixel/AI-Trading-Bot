name: NSE Data Test

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "EOD scan or next-session premarket news refresh"
        required: true
        type: choice
        default: EOD
        options:
          - EOD
          - PREMARKET
  schedule:
    # 16:40 UTC = 22:10 IST: EOD scan after NSE data is usually available.
    - cron: "40 16 * * 1-5"
    # 02:30 UTC = 08:00 IST: premarket refresh.
    - cron: "30 2 * * 1-5"

permissions:
  contents: read

jobs:
  nse-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore NSE, delivery, and sector history caches
        uses: actions/cache@v5
        with:
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytest yfinance

      - name: Check repository files
        run: |
          echo "===== REQUIRED PYTHON FILES ====="
          for f in volume_gainer.py main_board_filter.py v8_layers_14_41.py news_catalyst.py sector_data.py delivery_filter.py liquidity_filter.py fundamental_filter.py fundamental_data_provider.py fundamental_shortlist.py fundamental_official_filings.py risk_controls.py; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done
          python --version

      - name: Run NSE V8 compile and regression tests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: "false"
        run: |
          set -e
          echo "===== PYTHON COMPILE CHECK ====="
          python -m py_compile volume_gainer.py main_board_filter.py v8_layers_14_41.py news_catalyst.py sector_data.py delivery_filter.py liquidity_filter.py fundamental_filter.py fundamental_data_provider.py fundamental_shortlist.py fundamental_official_filings.py risk_controls.py nse_bhavcopy_test.py nifty500_api_test.py

          echo "===== MAIN BOARD ONLY TESTS ====="
          python -m pytest -q test_main_board_filter.py
          echo "===== DELIVERY / LIQUIDITY / FUNDAMENTAL / PIPELINE TESTS ====="
          python -m pytest -q test_delivery_rule.py test_delivery_filter_fallback.py test_liquidity_filter.py test_fundamental_filter.py test_fundamental_data_provider.py test_fundamental_shortlist_and_alignment.py test_fundamental_official_filings.py test_risk_controls.py test_selection_pipeline_order.py

          echo "===== V8 REGRESSION TESTS ====="
          python -u test_v8_regression.py

          echo "===== SECTOR / NEWS / CACHE UNIT TESTS ====="
          python -u -m unittest -v \
            test_sector_news_final_fix \
            test_sector_mapping_cache_reconciliation \
            test_niftyindices_history_bootstrap \
            test_news_official_feed_diagnostics \
            test_news_catalyst_matching \
            test_news_issuer_matching \
            test_nse_official_index_api

          echo "===== PYTEST PARSER TESTS ====="
          python -m pytest -q test_news_catalyst_parser.py
          echo "===== UPCOMING CORPORATE EVENTS TESTS ====="
          python -m pytest -q test_upcoming_corporate_events.py

      - name: Run NSE Volume Gainer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: "true"
          NEWS_SCAN_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5' && 'PREMARKET' || inputs.scan_mode || 'EOD' }}
        run: |
          set -e
          echo "===== NEWS SCAN MODE: ${NEWS_SCAN_MODE} ====="
          python -u ./volume_gainer.py
          echo "===== NSE SCANNER FINISHED ====="

      - name: Run RSI 30/40/50 retest comparison from existing cache
        if: always()
        run: |
          set -e
          echo "===== RSI RETEST UNIT TESTS ====="
          python -m pytest -q test_rsi_retest_existing_cache.py
          echo "===== RSI RETEST BACKTEST (NO NETWORK) ====="
          python -u rsi_retest_existing_cache.py
          echo "===== RSI RETEST COMPARISON PREVIEW ====="
          if [ -f outputs/rsi_retest/rsi_retest_comparison.csv ]; then cat outputs/rsi_retest/rsi_retest_comparison.csv; fi
          echo "===== CACHE COVERAGE PREVIEW ====="
          if [ -f outputs/rsi_retest/cache_coverage.csv ]; then cat outputs/rsi_retest/cache_coverage.csv; fi

      - name: Diagnose NSE V8 data files
        if: always()
        run: |
          echo "===== LAYER STATUS SUMMARY PREVIEW ====="
          if [ -f outputs/v8_layer_status_summary.csv ]; then head -12 outputs/v8_layer_status_summary.csv; else echo "Layer status summary not found"; fi
          echo "===== EOD WATCHLIST PREVIEW ====="
          if [ -f outputs/v8_eod_watchlist.csv ]; then head -6 outputs/v8_eod_watchlist.csv; else echo "EOD watchlist not found"; fi
          echo "===== FUNDAMENTAL COLLECTION REPORTS ====="
          for f in outputs/v8_fundamental_provider_diagnostics.csv outputs/v8_fundamental_report.csv outputs/v8_delivery_a_fundamentals.csv outputs/v8_delivery_b_fundamentals.csv outputs/v8_delivery_ab_combined_fundamentals.csv outputs/v8_fundamental_complete_data.csv outputs/v8_fundamental_partial_data.csv outputs/v8_fundamental_missing_data.csv outputs/v8_fundamental_shortlist_all.csv outputs/v8_fundamental_shortlist_pass.csv; do
            if [ -f "$f" ]; then echo "===== $f (rows excluding header) ====="; python -c "import pandas as pd,sys; p=sys.argv[1]; d=pd.read_csv(p); print('rows=',len(d)); print(d.head(3).to_string(index=False))" "$f"; else echo "MISSING REPORT: $f"; fi
          done
          echo "===== SECTOR / DATA REPORTS ====="
          if [ -d data/reports ]; then
            find data/reports -maxdepth 2 -type f -print
            for f in data/reports/sector_candidate_mapping_*.csv data/reports/delivery_first_audit_*.csv; do
              if [ -f "$f" ]; then echo "===== $f ====="; head -12 "$f"; fi
            done
          fi
          echo "===== BHAVCOPY CACHE SAMPLE ====="
          if [ -d data/bhavcopy ]; then find data/bhavcopy -maxdepth 1 -type f -name "*.csv" -print | head -20; else echo "Bhavcopy cache directory does not exist"; fi

      - name: Upload NSE V8 reports and input templates
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nse-v8-reports-${{ github.run_id }}
          path: |
            outputs/
            outputs/rsi_retest/
            data/inputs/*.csv
            data/inputs/*.json
            data/reports/
          if-no-files-found: warn
