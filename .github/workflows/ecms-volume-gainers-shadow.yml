name: ECMS NSE VOLUME GAINERS - TWO DAILY SCANS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose EOD research (default) or 09:20 live recheck"
        required: true
        type: choice
        default: eod
        options: [eod, morning]
  schedule:
    - cron: "30 11 * * *" # 17:00 IST regular-session EOD
    - cron: "50 3 * * *"  # 09:20 IST regular-session Morning
    - cron: "55 8 * * *"  # 14:25 IST configured special-session Morning slot
permissions:
  contents: read
concurrency:
  group: ecms-volume-gainers-shadow
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile strategies/ecms/volume_gainers.py strategies/ecms/information.py strategies/ecms/free_fundamental_sources.py strategies/ecms/fundamental_source_compilation.py strategies/ecms/debt_equity_xbrl_audit.py strategies/ecms/ratio_xbrl_discovery_audit.py strategies/ecms/filing_metadata_audit.py
          python -m pytest -q tests/test_ecms_volume_gainers.py tests/test_ecms_information.py tests/test_ecms_fundamental_research.py tests/test_ecms_eod.py tests/test_ecms_free_fundamental_sources.py tests/test_ecms_fundamental_source_compilation.py tests/test_ecms_debt_equity_xbrl_audit.py tests/test_ecms_ratio_xbrl_discovery_audit.py tests/test_ecms_filing_metadata_audit.py tests/test_ecms_gemini_research.py tests/test_ecms_secondary_source_periods.py test_fundamental_data_provider.py

  eod:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'eod') ||
      (github.event_name == 'schedule' && (github.event.schedule == '30 11 * * *'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Restore shared NSE cache read-only (same cache contract as production)
        id: shared-cache
        uses: actions/cache/restore@v5
        with:
          # Keep this path list and order identical to nse-test-scheduled.yml.
          # Cache archives are versioned by both action implementation and path list.
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/sector_constituents/
            data/cache/sector_quote_classifications/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
            data/inputs/fundamental_metrics.csv
            data/cache/fundamental_history/
            data/cache/telegram_premarket_news_seen.csv
            data/cache/xbrl_samples/
            data/cache/xbrl_period_pairs/
            data/cache/shareholding_xbrl/
            outputs/v8_official_financial_results_filings.csv
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-
            nse-bhavcopy-${{ runner.os }}-main-
      - name: Report shared cache restore result
        run: |
          echo "CACHE_HIT=${{ steps.shared-cache.outputs.cache-hit }}"
          echo "CACHE_PRIMARY_KEY=${{ steps.shared-cache.outputs.cache-primary-key }}"
          echo "CACHE_MATCHED_KEY=${{ steps.shared-cache.outputs.cache-matched-key }}"
      - name: Restore legacy ECMS state cache (pre research-cache expansion)
        id: legacy-ecms-cache
        uses: actions/cache/restore@v4
        with:
          # Compatibility bridge: restore the prior three-path cache so the
          # last valid EOD snapshot survives the expanded news/deals cache path list.
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/volume_gainers_same_day_morning.csv
            data/cache/ecms/fundamental_workspace/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ecms-vg-state-${{ github.ref_name }}-
      - name: Report legacy ECMS cache restore result
        run: echo "LEGACY_ECMS_CACHE_HIT=${{ steps.legacy-ecms-cache.outputs.cache-hit }}"
      - name: Restore ECMS-only Volume Gainers state and fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/volume_gainers_previous_eod_consumed.json
            data/cache/ecms/volume_gainers_same_day_morning.csv
            data/cache/ecms/fundamental_workspace/
            data/cache/ecms/news/
            data/cache/ecms/corporate_actions/
            data/cache/ecms/universe/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ecms-vg-state-${{ github.ref_name }}-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run EOD page research
        id: eod-research
        env:
          PYTHONUNBUFFERED: "1"
          V8_AUTO_FETCH_FUNDAMENTALS: "true"
          V8_FREE_FUNDAMENTAL_SOURCES: "true"
          FREE_FUNDAMENTAL_MAX_SYMBOLS_PER_RUN: "25"
          FREE_FUNDAMENTAL_RETRY_DAYS: "7"
          V8_FUNDAMENTAL_RETRY_DAYS: "7"
          V8_FUNDAMENTAL_REFRESH_DAYS: "7"
        run: python -m strategies.ecms.volume_gainers --mode eod
      - name: Validate current-run EOD snapshot before saving cache
        id: eod-snapshot-check
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          from strategies.ecms.volume_gainers import _is_current_run_eod_snapshot_cacheable
          marker_path = Path("data/cache/ecms/eod_snapshot_run_marker.json")
          state_path = Path("data/cache/ecms/volume_gainers_previous_eod.csv")
          valid = False
          try:
              marker = json.loads(marker_path.read_text(encoding="utf-8"))
              with state_path.open("r", encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              # Only a complete EOD snapshot captured on its own session date
              # may replace the previous-session reference for the next Morning.
              valid = _is_current_run_eod_snapshot_cacheable(
                  marker, rows, os.getenv("GITHUB_RUN_ID", "")
              )
          except Exception as exc:
              print(f"Current-run EOD snapshot is not cacheable: {type(exc).__name__}: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cacheable={'true' if valid else 'false'}\n")
          print(f"ECMS_EOD_SNAPSHOT_CACHEABLE={valid}")
          PY
      - name: Save previous EOD page universe and ECMS fundamental cache for morning recheck
        if: always() && steps.eod-snapshot-check.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/volume_gainers_previous_eod_consumed.json
            data/cache/ecms/volume_gainers_same_day_morning.csv
            data/cache/ecms/fundamental_workspace/
            data/cache/ecms/news/
            data/cache/ecms/corporate_actions/
            data/cache/ecms/universe/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload EOD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecms-volume-gainers-eod-${{ github.run_id }}
          path: |
            outputs/ecms/volume_gainers_*
            outputs/ecms/fundamental_*.csv
            outputs/ecms/fundamental_metric_verification*.csv
            outputs/ecms/v8_fundamental_metric_verification*.csv
            outputs/ecms/v8_fundamental_generated_evidence.csv
            outputs/ecms/v8_fundamental_evidence_generation_diagnostics.csv
            outputs/ecms/fundamental_filing_metadata_summary.csv
            outputs/ecms/fundamental_filing_metadata_audit.csv
            outputs/ecms/xbrl_ephemeral/
          if-no-files-found: warn
          retention-days: 30
      - name: Send separate ECMS EOD Telegram report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ECMS_MODE: EOD
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY_PATH: outputs/ecms/volume_gainers_eod_summary.json
          RESEARCH_PATH: outputs/ecms/volume_gainers_eod_research.csv
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          import requests
          token, chat_id = os.getenv("TELEGRAM_BOT_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              print("ECMS Telegram skipped: Telegram secrets are not configured.")
              raise SystemExit(0)
          lines = [f"📊 ECMS EOD FUNDAMENTAL + INFORMATION REPORT", f"Status: {os.getenv('JOB_STATUS', 'unknown').upper()}"]
          path = Path(os.getenv("SUMMARY_PATH", ""))
          if path.is_file():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  for key, label in [("scan_date_ist","Scan date"),("data_as_of_date_ist","Completed data as of"),("morning_comparison_date_ist","Morning comparison date"),("morning_snapshot_found","Morning snapshot matched"),("morning_repeat_count","Morning/EOD repeated stocks"),("eod_new_entry_count","New EOD entries"),("eod_date_ist","Completed EOD data date"),("eligible_mainboard_equities","Eligible page stocks"),("fundamental_pass","Fundamental PASS"),("fundamental_fail","Fundamental FAIL"),("wait_for_data","Wait for data"),("news_data_found","News found"),("news_no_data_found","News checked/no match"),("news_source_unavailable","News source unavailable"),("upcoming_events_data_found","Upcoming events found"),("upcoming_events_no_data_found","Upcoming events checked/no match"),("upcoming_events_source_coverage_partial","Partial event/board-meeting source coverage"),("bulk_block_deals_data_found","Bulk/block deals found"),("bulk_block_source_coverage_partial","Partial bulk/block source coverage"),("bulk_block_deals_no_data_found","Bulk/block deals checked/no match"),("corporate_actions_data_found","Official corporate actions found"),("corporate_action_disclosures_found","Corporate-action announcements found")]:
                      if key in data: lines.append(f"{label}: {data[key]}")
              except Exception as exc:
                  lines.append(f"Summary unavailable: {type(exc).__name__}")
          research_path = Path(os.getenv("RESEARCH_PATH", ""))
          stock_lines = []
          if research_path.is_file():
              try:
                  with research_path.open("r", encoding="utf-8-sig", newline="") as handle:
                      for row in csv.DictReader(handle):
                          symbol = (row.get("TckrSymb") or row.get("Symbol") or "").strip()
                          if not symbol:
                              continue
                          shortlist = (row.get("FundamentalShortlistStatus") or "NOT_AVAILABLE").strip()
                          verified = (row.get("FundamentalVerificationStatus") or "NOT_AVAILABLE").strip()
                          reason = (row.get("FundamentalShortlistReason") or "").strip().replace("\n", " ")
                          if len(reason) > 100:
                              reason = reason[:97] + "..."
                          valuation = (row.get("ValuationLabel") or "NOT AVAILABLE").strip()
                          news_status = (row.get("NewsResearchStatus") or "NOT_VERIFIED").strip()
                          news = (row.get("Last5DayNews") or "NOT AVAILABLE").strip().replace("\n", " ")
                          event_status = (row.get("UpcomingEventsResearchStatus") or "NOT_VERIFIED").strip()
                          events = (row.get("UpcomingEvents") or "NOT AVAILABLE").strip().replace("\n", " ")
                          result_date = (row.get("NextResultDate") or "NOT ANNOUNCED").strip()
                          deal_status = (row.get("BulkBlockDealsResearchStatus") or "NOT_VERIFIED").strip()
                          deal_summary = (row.get("BulkBlockDealSummary") or "").strip().replace("\n", " ")
                          recent_deals = (row.get("BulkBlockSummaryLast5Days") or "").strip().replace("\n", " ")
                          corporate_status = (row.get("CorporateActionResearchStatus") or "NOT_VERIFIED").strip()
                          corporate_summary = (row.get("CorporateActionSummary") or "").strip().replace("\n", " ")
                          rvol = (row.get("RVOL") or "NOT AVAILABLE").strip()
                          context = (
                              f"; valuation={valuation}; news[{news_status}]={news[:100]}"
                              f"; events[{event_status}]={events[:90]}; next_result={result_date}"
                              f"; deals[{deal_status}]={deal_summary[:90]}; recent_5d={recent_deals[:70]}"
                              f"; corporate_actions[{corporate_status}]={corporate_summary[:90]}; RVOL={rvol}"
                          )
                          stock_lines.append(
                              f"{symbol}: fundamental={shortlist}; official_XBRL={verified}"
                              + context
                              + (f"; note={reason}" if reason and shortlist.upper() != "PASS" else "")
                          )
              except Exception as exc:
                  stock_lines.append(f"Stock-level research report unavailable: {type(exc).__name__}")
          if stock_lines:
              lines.append("")
              lines.append("STOCK-WISE RESEARCH (all eligible stocks; PASS/FAIL/WAIT do not filter research):")
              lines.extend(stock_lines)
          else:
              lines.append("Stock-wise fundamental CSV unavailable; inspect the run artifact.")
          lines.append(f"Run / logs / artifact: {os.getenv('RUN_URL','')}")
          # Telegram sendMessage has a 4096-character limit. Split without cutting a stock row.
          chunks, current = [], ""
          for line in lines:
              candidate = line if not current else current + "\n" + line
              if len(candidate) > 3500 and current:
                  chunks.append(current)
                  current = line
              else:
                  current = candidate
          if current:
              chunks.append(current)
          for index, chunk in enumerate(chunks, start=1):
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat_id, "text": chunk},
                  timeout=25,
              )
              response.raise_for_status()
              result = response.json()
              if result.get("ok") is not True:
                  raise RuntimeError(f"Telegram API rejected ECMS EOD message part {index}: {result}")
              print(f"ECMS EOD Telegram part {index}/{len(chunks)} delivered. message_id={result.get('result',{}).get('message_id')}")
          PY
  morning:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') ||
      (github.event_name == 'schedule' && (github.event.schedule == '50 3 * * *' || github.event.schedule == '55 8 * * *'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Restore legacy ECMS state cache (pre research-cache expansion)
        id: legacy-ecms-cache
        uses: actions/cache/restore@v4
        with:
          # Compatibility bridge: restore the prior three-path cache so the
          # last valid EOD snapshot survives the expanded news/deals cache path list.
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/volume_gainers_same_day_morning.csv
            data/cache/ecms/fundamental_workspace/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ecms-vg-state-${{ github.ref_name }}-
      - name: Report legacy ECMS cache restore result
        run: echo "LEGACY_ECMS_CACHE_HIT=${{ steps.legacy-ecms-cache.outputs.cache-hit }}"
      - name: Restore previous EOD page universe and ECMS fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/volume_gainers_previous_eod_consumed.json
            data/cache/ecms/volume_gainers_same_day_morning.csv
            data/cache/ecms/fundamental_workspace/
            data/cache/ecms/news/
            data/cache/ecms/corporate_actions/
            data/cache/ecms/universe/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ecms-vg-state-${{ github.ref_name }}-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run 09:20 morning fundamental reassessment
        env:
          PYTHONUNBUFFERED: "1"
          V8_AUTO_FETCH_FUNDAMENTALS: "true"
          V8_FREE_FUNDAMENTAL_SOURCES: "true"
          FREE_FUNDAMENTAL_MAX_SYMBOLS_PER_RUN: "25"
          FREE_FUNDAMENTAL_RETRY_DAYS: "7"
          V8_FUNDAMENTAL_RETRY_DAYS: "7"
          V8_FUNDAMENTAL_REFRESH_DAYS: "7"
        run: python -m strategies.ecms.volume_gainers --mode morning
      - name: Validate current-run same-day Morning snapshot before saving cache
        id: morning-snapshot-check
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          today_ist = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          path = Path("data/cache/ecms/volume_gainers_same_day_morning.csv")
          eod_path = Path("data/cache/ecms/volume_gainers_previous_eod.csv")
          consumed_path = Path("data/cache/ecms/volume_gainers_previous_eod_consumed.json")
          report_path = Path("outputs/ecms/volume_gainers_morning_recheck.csv")
          summary_path = Path("outputs/ecms/volume_gainers_morning_summary.json")
          valid = False
          try:
              with path.open("r", encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              with report_path.open("r", encoding="utf-8-sig", newline="") as handle:
                  report_rows = list(csv.DictReader(handle))
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              consumed = json.loads(consumed_path.read_text(encoding="utf-8"))
              symbols = [str(row.get("TckrSymb", "")).strip().upper() for row in rows]
              dates = {str(row.get("MorningDate", "")).strip() for row in rows}
              comparison_complete = (
                  bool(report_rows)
                  and summary.get("previous_eod_reference_consumed") is True
                  and consumed.get("status") == "CONSUMED"
                  and consumed.get("consumed_eod_date") == summary.get("data_as_of_date_ist")
                  and not eod_path.exists()
              )
              valid = (
                  bool(rows)
                  and all(symbols)
                  and len(symbols) == len(set(symbols))
                  and dates == {today_ist}
                  and all(row.get("MorningSnapshotType") == "MORNING" for row in rows)
                  and all(row.get("MorningSnapshotStatus") == "VALID" for row in rows)
                  and all(row.get("MorningRunId") == os.getenv("GITHUB_RUN_ID", "") for row in rows)
                  and comparison_complete
              )
          except Exception as exc:
              print(f"Current-run Morning snapshot is not cacheable: {type(exc).__name__}: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cacheable={'true' if valid else 'false'}\n")
          print(f"ECMS_MORNING_SNAPSHOT_CACHEABLE={valid}")
          PY
      - name: Save ECMS fundamental cache after validated morning assessment
        if: always() && steps.morning-snapshot-check.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/volume_gainers_previous_eod_consumed.json
            data/cache/ecms/volume_gainers_same_day_morning.csv
            data/cache/ecms/fundamental_workspace/
            data/cache/ecms/news/
            data/cache/ecms/corporate_actions/
            data/cache/ecms/universe/
          key: ecms-vg-state-${{ github.ref_name }}-morning-${{ github.run_id }}
      - name: Upload morning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecms-volume-gainers-morning-${{ github.run_id }}
          path: |
            outputs/ecms/volume_gainers_morning_*
            outputs/ecms/fundamental_*.csv
            outputs/ecms/fundamental_metric_verification*.csv
            outputs/ecms/fundamental_filing_metadata_summary.csv
            outputs/ecms/xbrl_ephemeral/
          if-no-files-found: warn
          retention-days: 30
      - name: Send separate ECMS 09:20 morning Telegram report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY_PATH: outputs/ecms/volume_gainers_morning_summary.json
          RESEARCH_PATH: outputs/ecms/volume_gainers_morning_recheck.csv
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          import requests
          token, chat_id = os.getenv("TELEGRAM_BOT_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              print("ECMS Telegram skipped: Telegram secrets are not configured.")
              raise SystemExit(0)
          lines = ["🌅 ECMS 09:20 MORNING FUNDAMENTAL RECHECK", f"Status: {os.getenv('JOB_STATUS','unknown').upper()}"]
          path = Path(os.getenv("SUMMARY_PATH", ""))
          if path.is_file():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  for key, label in [("scan_date_ist","Morning scan date"),("data_as_of_date_ist","Completed data as of"),("morning_time_ist","Checked at"),("morning_rvol_data_found","Prior-session RVOL available"),("morning_rvol_data_missing","Prior-session RVOL missing"),("current_page_eligible_symbols","Morning page stocks"),("page_presence_double_confirmed","Stocks present in both EOD and Morning lists"),("morning_fundamental_pass","Morning Fundamental PASS"),("eod_fundamental_pass_repeats","EOD PASS repeated in morning"),("morning_new_entries","New morning entries"),("eod_only_not_on_morning_page","EOD-only not on morning page"),("double_confirmed","Fundamental PASS at both checkpoints"),("eod_pass_not_morning_pass","EOD PASS, morning not PASS"),("morning_wait_for_data","Wait for data"),("news_data_found","News found"),("news_no_data_found","News checked/no match"),("news_source_unavailable","News source unavailable"),("upcoming_events_data_found","Upcoming events found"),("upcoming_events_no_data_found","Upcoming events checked/no match"),("upcoming_events_source_coverage_partial","Partial event/board-meeting source coverage"),("bulk_block_deals_data_found","Bulk/block deals found"),("bulk_block_source_coverage_partial","Partial bulk/block source coverage"),("bulk_block_deals_no_data_found","Bulk/block deals checked/no match"),("corporate_actions_data_found","Official corporate actions found"),("corporate_action_disclosures_found","Corporate-action announcements found")]:
                      if key in data: lines.append(f"{label}: {data[key]}")
              except Exception as exc:
                  lines.append(f"Summary unavailable: {type(exc).__name__}")
          report_path = Path(os.getenv("RESEARCH_PATH", ""))
          if report_path.is_file():
              try:
                  with report_path.open("r", encoding="utf-8-sig", newline="") as handle:
                      for row in csv.DictReader(handle):
                          symbol = (row.get("TckrSymb") or "").strip()
                          if not symbol:
                              continue
                          lines.append(
                              f"{symbol}: {row.get('MorningStatus','')}; EOD={row.get('EODFundamentalShortlistStatus','')}; "
                              f"morning={row.get('MorningFundamentalShortlistStatus','')}; "
                              f"valuation={row.get('ValuationLabel','NOT AVAILABLE')}; "
                              f"news={str(row.get('Last5DayNews','NOT AVAILABLE'))[:90]}; "
                              f"events={str(row.get('UpcomingEvents','NOT AVAILABLE'))[:80]}[{row.get('UpcomingEventsSourceCoverageStatus','NOT_VERIFIED')}]; "
                              f"result={row.get('NextResultDate','NOT ANNOUNCED')}; "
                              f"deals={row.get('BulkBlockDealStatus','NOT AVAILABLE')}/{row.get('BulkBlockSourceCoverageStatus','NOT_VERIFIED')}:"
                              f"{str(row.get('BulkBlockDealSummary',''))[:100]} "
                              f"corporate_actions={row.get('CorporateActionResearchStatus','NOT_VERIFIED')}:"
                              f"{str(row.get('CorporateActionSummary',''))[:100]} "
                              f"RVOL(EOD)={row.get('EODRVOL','NOT AVAILABLE')}"
                          )
              except Exception as exc:
                  lines.append(f"Morning stock report unavailable: {type(exc).__name__}")
          lines.append(f"Run / logs / artifact: {os.getenv('RUN_URL','')}")
          chunks, current = [], ""
          for line in lines:
              candidate = line if not current else current + "\n" + line
              if len(candidate) > 3500 and current:
                  chunks.append(current)
                  current = line
              else:
                  current = candidate
          if current:
              chunks.append(current)
          for index, chunk in enumerate(chunks, start=1):
              response = requests.post(f"https://api.telegram.org/bot{token}/sendMessage", data={"chat_id":chat_id,"text":chunk}, timeout=25)
              response.raise_for_status()
              result = response.json()
              if result.get("ok") is not True: raise RuntimeError(f"Telegram API rejected ECMS morning message part {index}: {result}")
              print(f"ECMS morning Telegram part {index}/{len(chunks)} delivered. message_id={result.get('result',{}).get('message_id')}")
          PY