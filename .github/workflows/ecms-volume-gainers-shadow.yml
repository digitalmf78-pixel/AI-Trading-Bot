name: ECMS VOLUME GAINERS - MANUAL EOD RUN
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose EOD research (default) or 09:20 live recheck"
        required: true
        type: choice
        default: eod
        options: [eod, morning]
  schedule:
    - cron: "15 11 * * 1-5" # 16:45 IST EOD page snapshot
    - cron: "50 3 * * 1-5"  # 09:20 IST morning recheck
permissions:
  contents: read
concurrency:
  group: ecms-volume-gainers-shadow
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile strategies/ecms/volume_gainers.py
          python -m pytest -q tests/test_ecms_volume_gainers.py tests/test_ecms_eod.py

  eod:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'eod') ||
      (github.event_name == 'schedule' && github.event.schedule == '15 11 * * 1-5')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Restore shared NSE cache read-only (same cache contract as production)
        id: shared-cache
        uses: actions/cache/restore@v5
        with:
          # Keep this path list and order identical to nse-test-scheduled.yml.
          # Cache archives are versioned by both action implementation and path list.
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/sector_constituents/
            data/cache/sector_quote_classifications/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
            data/inputs/fundamental_metrics.csv
            data/cache/fundamental_history/
            data/cache/telegram_premarket_news_seen.csv
            data/cache/xbrl_samples/
            data/cache/xbrl_period_pairs/
            data/cache/shareholding_xbrl/
            outputs/v8_official_financial_results_filings.csv
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-
            nse-bhavcopy-${{ runner.os }}-main-
      - name: Report shared cache restore result
        run: |
          echo "CACHE_HIT=${{ steps.shared-cache.outputs.cache-hit }}"
          echo "CACHE_PRIMARY_KEY=${{ steps.shared-cache.outputs.cache-primary-key }}"
          echo "CACHE_MATCHED_KEY=${{ steps.shared-cache.outputs.cache-matched-key }}"
      - name: Restore ECMS-only Volume Gainers state and fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/fundamental_workspace/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ecms-vg-state-${{ github.ref_name }}-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile strategies/ecms/volume_gainers.py
          python -m pytest -q tests/test_ecms_volume_gainers.py
      - name: Run EOD page research
        env:
          PYTHONUNBUFFERED: "1"
          V8_AUTO_FETCH_FUNDAMENTALS: "true"
          V8_FREE_FUNDAMENTAL_SOURCES: "true"
          FREE_FUNDAMENTAL_MAX_SYMBOLS_PER_RUN: "25"
          FREE_FUNDAMENTAL_RETRY_DAYS: "7"
          V8_FUNDAMENTAL_RETRY_DAYS: "7"
        run: python -m strategies.ecms.volume_gainers --mode eod
      - name: Save previous EOD page universe and ECMS fundamental cache for morning recheck
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/fundamental_workspace/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload EOD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecms-volume-gainers-eod-${{ github.run_id }}
          path: |
            outputs/ecms/volume_gainers_*
            outputs/ecms/fundamental_*.csv
            outputs/ecms/fundamental_metric_verification*.csv
            outputs/ecms/fundamental_filing_metadata_summary.csv
            outputs/ecms/xbrl_ephemeral/
          if-no-files-found: warn
          retention-days: 30
  morning:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') ||
      (github.event_name == 'schedule' && github.event.schedule == '50 3 * * 1-5')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Restore previous EOD page universe and ECMS fundamental cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/ecms/volume_gainers_previous_eod.csv
            data/cache/ecms/fundamental_workspace/
          key: ecms-vg-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ecms-vg-state-${{ github.ref_name }}-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile strategies/ecms/volume_gainers.py
          python -m pytest -q tests/test_ecms_volume_gainers.py
      - name: Run 09:20 morning recheck
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m strategies.ecms.volume_gainers --mode morning
      - name: Upload morning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecms-volume-gainers-morning-${{ github.run_id }}
          path: outputs/ecms/volume_gainers_morning_*
          if-no-files-found: warn
          retention-days: 30
