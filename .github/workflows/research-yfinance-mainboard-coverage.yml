name: Research Yahoo Finance Mainboard Coverage

on:
  push:
    branches:
      - research/free-fundamental-source-validation-2026-11-14
    paths:
      - ".yfinance-coverage-trigger"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Evenly-spaced Mainboard symbols to test (max 100)"
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: research-yfinance-mainboard-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v5
        with:
          ref: research/free-fundamental-source-validation-2026-11-14
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run read-only Yahoo Finance coverage sample
        env:
          YAHOO_COVERAGE_BATCH_SIZE: ${{ github.event.inputs.batch_size || '25' }}
        run: python -u research_yfinance_coverage.py
      - name: Upload Yahoo coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: yfinance-mainboard-coverage
          path: data/research/yfinance_coverage/
          if-no-files-found: warn
