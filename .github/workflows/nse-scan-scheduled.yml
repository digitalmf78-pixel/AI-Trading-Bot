name: NSE V8 Scheduled Scan

on:
  schedule:
    # Every trading day at 09:15 IST (03:45 UTC)
    - cron: '45 3 * * 1-5'
  workflow_dispatch:
    inputs:
      asof_date:
        description: 'EOD date (YYYY-MM-DD), defaults to latest available'
        required: false
        default: ''

env:
  PYTHONPATH: '.'
  V8_AUTO_FETCH_FUNDAMENTALS: 'true'
  V8_FUNDAMENTAL_REFRESH_DAYS: '30'

jobs:
  nse-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            data/bhavcopy/
            data/cache/
            data/inputs/fundamental_metrics.csv
            data/inputs/fundamental_thresholds.json
          key: nse-v8-data-${{ github.run_id }}
          restore-keys: |
            nse-v8-data-

      - name: Run NSE V8 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_CONFIG_JSON: ${{ secrets.RISK_CONFIG_JSON }}
          SEND_TELEGRAM: 'true'
        run: |
          python volume_gainer.py

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-scan-reports-${{ github.run_number }}
          path: outputs/
          retention-days: 30

      - name: Upload delivery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-delivery-audit-${{ github.run_number }}
          path: data/reports/
          retention-days: 30
