name: ECMS U-Turn Research Unit Tests

on:
  push:
    branches:
      - research/bharat-sm-data-fundamental-audit-2026-11-17
    paths:
      - "strategies/ecms/fundamental_uturn.py"
      - "tests/test_ecms_fundamental_uturn.py"
      - ".github/workflows/ecms-uturn-research-tests.yml"
  pull_request:
    paths:
      - "strategies/ecms/fundamental_uturn.py"
      - "tests/test_ecms_fundamental_uturn.py"
      - ".github/workflows/ecms-uturn-research-tests.yml"

permissions:
  contents: read

jobs:
  uturn-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout research code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pip pandas pytest

      - name: Compile research module
        run: python -m py_compile strategies/ecms/fundamental_uturn.py

      - name: Run U-Turn research unit tests only
        run: python -m pytest -q tests/test_ecms_fundamental_uturn.py
