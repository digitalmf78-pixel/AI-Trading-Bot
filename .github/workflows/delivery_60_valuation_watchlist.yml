name: 5-Day Delivery Above 60% Watchlist (Reuse V8 Cache)

# This is a separate shortlist-only workflow. It does not edit or run the main V8 scanner.
# A symbol passes only when its Delivery % is strictly greater than 60 on EACH of 5 valid sessions.
on:
  workflow_dispatch:
  schedule:
    # 17:30 UTC = 23:00 IST, Monday-Friday, after the NSE cash-market session.
    - cron: "30 17 * * 1-5"

permissions:
  contents: read

jobs:
  build-watchlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Keep the exact cache paths/key prefix used by the main NSE V8 workflow.
      - name: Restore existing NSE V8 data cache
        uses: actions/cache@v5
        with:
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas

      - name: Filter using five individual daily Delivery percentages
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import pandas as pd
          from delivery_filter import get_delivery_sessions

          OUTPUT = Path("delivery_60_each_of_5_sessions_watchlist.csv")
          REQUIRED_SESSIONS = 5
          MIN_DELIVERY_INCLUSIVE = 60.0
          MAX_ASOF_LOOKBACK_DAYS = 10

          def write_empty(reason):
              pd.DataFrame(columns=["SYMBOL"]).to_csv(OUTPUT, index=False)
              print(f"[RESULT] {reason}; empty SYMBOL-only CSV written")

          today_ist = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          sessions = None
          asof = None
          last_error = None
          # If today's EOD report is not published yet, locate the most recent date
          # that has a valid report, then obtain five distinct valid sessions ending there.
          for offset in range(MAX_ASOF_LOOKBACK_DAYS + 1):
              candidate_date = today_ist - timedelta(days=offset)
              if candidate_date.weekday() >= 5:
                  continue
              try:
                  candidate_sessions = get_delivery_sessions(
                      candidate_date, required_sessions=REQUIRED_SESSIONS
                  )
                  if len({day for day, _ in candidate_sessions}) != REQUIRED_SESSIONS:
                      raise RuntimeError("WAIT_FOR_DATA: five distinct valid sessions required")
                  sessions, asof = candidate_sessions, candidate_date
                  break
              except RuntimeError as exc:
                  last_error = exc
                  print(f"[DELIVERY] No complete five-session window ending {candidate_date}: {exc}")

          if not sessions or len(sessions) != REQUIRED_SESSIONS:
              write_empty(f"WAIT_FOR_DATA: could not find five valid distinct sessions; last_error={last_error}")
              raise SystemExit(0)

          sessions = sorted(sessions, key=lambda item: item[0])
          print("[SESSIONS] oldest-to-newest: " + ", ".join(day.isoformat() for day, _ in sessions))
          daily_maps = []
          for day, raw in sessions:
              frame = raw.copy()
              frame.columns = [str(c).strip().upper().replace(" ", "_") for c in frame.columns]
              required = {"SYMBOL", "SERIES", "DELIV_PER"}
              if not required.issubset(frame.columns):
                  write_empty(f"WAIT_FOR_DATA: required columns missing for {day}")
                  raise SystemExit(0)
              frame["SYMBOL"] = frame["SYMBOL"].astype(str).str.strip().str.upper()
              frame["SERIES"] = frame["SERIES"].astype(str).str.strip().str.upper()
              frame["DELIV_PER"] = pd.to_numeric(frame["DELIV_PER"], errors="coerce")
              frame = frame[(frame["SERIES"] == "EQ") & frame["DELIV_PER"].between(0, 100)]
              # Duplicate SYMBOL rows are ambiguous and are excluded for that session.
              counts = frame.groupby("SYMBOL").size()
              ambiguous = set(counts[counts != 1].index)
              if ambiguous:
                  frame = frame[~frame["SYMBOL"].isin(ambiguous)]
              daily_maps.append(frame.set_index("SYMBOL")["DELIV_PER"].to_dict())
              print(f"[SESSION] {day}: valid EQ symbols={len(daily_maps[-1])}; threshold is >= {MIN_DELIVERY_INCLUSIVE:.2f}%")

          common_symbols = set(daily_maps[0])
          for day_map in daily_maps[1:]:
              common_symbols.intersection_update(day_map)

          # Strictly greater than 60.00 on every single one of the five sessions.
          qualifying = sorted(
              symbol for symbol in common_symbols
              if all(day_map[symbol] >= MIN_DELIVERY_INCLUSIVE for day_map in daily_maps)
          )
          print(f"[DELIVERY] qualifying_symbols_all_5_days_at_least_60={len(qualifying)}")
          print(f"[DELIVERY] symbols_missing_any_session={len(set.union(*(set(m) for m in daily_maps)) - common_symbols)}")
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          pd.DataFrame({"SYMBOL": qualifying}).to_csv(OUTPUT, index=False)
          if qualifying:
              print("\n===== FINAL SHORTLIST: SYMBOLS ONLY =====")
              print("\n".join(qualifying))
          else:
              print("No symbols passed the >=60% rule on all five sessions.")
          print(f"[DONE] wrote {OUTPUT} rows={len(qualifying)} asof={asof}")
          PY

      - name: Upload shortlist CSV
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: delivery-60-each-of-5-sessions-${{ github.run_id }}
          path: delivery_60_each_of_5_sessions_watchlist.csv
          if-no-files-found: warn
