name: 5-Day Delivery Above 60% Watchlist (Reuse V8 Cache)

# Separate Delivery-only shortlist. Uses the same official stock universe as V8,
# but applies no RVOL, liquidity, fundamental, technical, or risk filters.
# A stock passes only when Delivery % is >=60.00% on EACH of 5 valid sessions.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/delivery_60_valuation_watchlist.yml"
  schedule:
    # 17:30 UTC = 23:00 IST, Monday-Friday, after the NSE cash-market session.
    - cron: "30 17 * * 1-5"

permissions:
  contents: read

jobs:
  build-watchlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Restore the same Bhavcopy, delivery, and official universe caches as V8.
      - name: Restore existing NSE V8 data cache
        uses: actions/cache@v5
        with:
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas pytest

      - name: Filter using five individual daily Delivery percentages
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import pandas as pd
          import requests
          from delivery_filter import get_delivery_sessions
          from delivery_60_each_of_5_sessions import (
              AUDIT_COLUMNS,
              filter_five_session_delivery,
              eligible_mainboard_eq_symbols,
          )
          from main_board_filter import load_official_board_lists
          from nse_trading_calendar import is_trading_session
          from sector_data import _download_official_etf_symbols

          OUTPUT = Path("delivery_60_each_of_5_sessions_watchlist.csv")
          AUDIT = Path("delivery_60_each_of_5_sessions_audit.csv")
          REQUIRED_SESSIONS = 5
          MAX_ASOF_LOOKBACK_DAYS = 10

          def write_empty(reason):
              pd.DataFrame(columns=["SYMBOL"]).to_csv(OUTPUT, index=False)
              pd.DataFrame(columns=AUDIT_COLUMNS).to_csv(AUDIT, index=False)
              print(f"[RESULT] {reason}; empty SYMBOL-only shortlist and audit written")

          today_ist = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          sessions = None
          asof = None
          last_error = None
          for offset in range(MAX_ASOF_LOOKBACK_DAYS + 1):
              candidate_date = today_ist - timedelta(days=offset)
              if not is_trading_session(candidate_date):
                  continue
              try:
                  candidate_sessions = get_delivery_sessions(
                      candidate_date, required_sessions=REQUIRED_SESSIONS
                  )
                  if len({day for day, _ in candidate_sessions}) != REQUIRED_SESSIONS:
                      raise RuntimeError("WAIT_FOR_DATA: five distinct valid sessions required")
                  sessions, asof = candidate_sessions, candidate_date
                  break
              except RuntimeError as exc:
                  last_error = exc
                  print(f"[DELIVERY] No complete five-session window ending {candidate_date}: {exc}")

          if not sessions or len(sessions) != REQUIRED_SESSIONS:
              write_empty(f"WAIT_FOR_DATA: could not find five valid distinct sessions; last_error={last_error}")
              raise SystemExit(0)

          sessions = sorted(sessions, key=lambda item: item[0])
          asof = sessions[-1][0]
          print("[SESSIONS] oldest-to-newest: " + ", ".join(day.isoformat() for day, _ in sessions))

          # Run focused unit tests before any live/cache-based shortlist work.
          import subprocess, sys
          subprocess.run([sys.executable, "-m", "pytest", "-q", "test_delivery_60_each_of_5_sessions.py"], check=True)

          # Resolve the same official Main Board / SME classification used by V8.
          http = requests.Session()
          try:
              main_symbols, sme_symbols, board_sources = load_official_board_lists(session=http)
          except Exception as exc:
              write_empty(f"WAIT_FOR_DATA: official Main Board/SME universe unavailable: {type(exc).__name__}: {exc}")
              raise SystemExit(0)
          board_source_label = (
              f"NSE_MAIN={board_sources['main_board_source']};"
              f"NSE_SME={board_sources['sme_source']}"
          )

          # Official ETF symbols are preferred. Bhavcopy ISIN and instrument-name
          # checks remain active as the same conservative fallback used by V8.
          official_etf_symbols = _download_official_etf_symbols(http) or set()
          print(
              f"[UNIVERSE] official_main_board={len(main_symbols)} "
              f"official_sme={len(sme_symbols)} official_etf={len(official_etf_symbols)} "
              f"sources={board_source_label}"
          )

          eligible_symbols_by_date = {}
          for day, _ in sessions:
              bhav_path = Path("data/bhavcopy") / f"bhavcopy_{day:%Y%m%d}.csv"
              if not bhav_path.is_file():
                  write_empty(f"WAIT_FOR_DATA: cached official Bhavcopy missing for {day}")
                  raise SystemExit(0)

              bhav = pd.read_csv(bhav_path, dtype=str)
              bhav.columns = [str(c).strip() for c in bhav.columns]
              required = {"TckrSymb", "SctySrs", "ClsPric", "TtlTradgVol", "ISIN"}
              if not required.issubset(bhav.columns):
                  write_empty(f"WAIT_FOR_DATA: Bhavcopy schema incomplete for {day}: missing={sorted(required - set(bhav.columns))}")
                  raise SystemExit(0)

              date_col = next((c for c in ("BizDt", "TradDt", "TRADDT", "BUSINESS_DATE", "DATE") if c in bhav.columns), None)
              if date_col is None:
                  write_empty(f"WAIT_FOR_DATA: Bhavcopy has no internal business date for {day}")
                  raise SystemExit(0)
              parsed_dates = pd.to_datetime(bhav[date_col], errors="coerce").dt.date.dropna().unique().tolist()
              if set(parsed_dates) != {day}:
                  write_empty(f"WAIT_FOR_DATA: Bhavcopy date mismatch for {day}: {parsed_dates}")
                  raise SystemExit(0)

              bhav["TckrSymb"] = bhav["TckrSymb"].astype(str).str.strip().str.upper()
              bhav["SctySrs"] = bhav["SctySrs"].astype(str).str.strip().str.upper()
              bhav["ClsPric"] = pd.to_numeric(bhav["ClsPric"], errors="coerce")
              bhav["TtlTradgVol"] = pd.to_numeric(bhav["TtlTradgVol"], errors="coerce")
              bhav = bhav[
                  bhav["SctySrs"].eq("EQ")
                  & bhav["ClsPric"].gt(0)
                  & bhav["TtlTradgVol"].ge(0)
              ].copy()

              try:
                  eligible_symbols, universe_summary = eligible_mainboard_eq_symbols(
                      bhav,
                      main_symbols,
                      sme_symbols,
                      official_etf_symbols,
                      source_status=board_source_label,
                  )
              except ValueError as exc:
                  write_empty(f"WAIT_FOR_DATA: stock-universe audit failed for {day}: {exc}")
                  raise SystemExit(0)
              eligible_symbols_by_date[day] = eligible_symbols
              print(f"[UNIVERSE] {day}: {universe_summary}")

          try:
              qualifying, audit, summary = filter_five_session_delivery(
                  sessions,
                  eligible_symbols_by_date=eligible_symbols_by_date,
                  minimum_delivery=60.0,
              )
          except (ValueError, KeyError) as exc:
              write_empty(f"WAIT_FOR_DATA: five-session Delivery audit failed: {type(exc).__name__}: {exc}")
              raise SystemExit(0)

          pd.DataFrame({"SYMBOL": qualifying}).to_csv(OUTPUT, index=False)
          audit.to_csv(AUDIT, index=False)
          print(f"[DELIVERY] qualifying_symbols_all_5_days_at_least_60={len(qualifying)}")
          print(f"[DELIVERY] common_eligible_symbols={summary['common_symbols']}")
          print(f"[DELIVERY] symbols_missing_any_session={summary['symbols_missing_any_session']}")
          print(f"[DONE] wrote {OUTPUT} rows={len(qualifying)} asof={asof}")
          print(f"[DONE] wrote {AUDIT} rows={len(audit)} with exact daily percentages")
          if qualifying:
              print("\n===== FINAL SHORTLIST: SYMBOLS ONLY =====")
              print("\n".join(qualifying))
          else:
              print("No official Main Board stock passed the >=60% rule on all five sessions.")
          PY

      - name: Upload shortlist and daily audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: delivery-60-each-of-5-sessions-${{ github.run_id }}
          path: |
            delivery_60_each_of_5_sessions_watchlist.csv
            delivery_60_each_of_5_sessions_audit.csv
          if-no-files-found: warn
