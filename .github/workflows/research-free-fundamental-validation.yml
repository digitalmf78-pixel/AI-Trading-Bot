name: Research Free Fundamental Source Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "free_fundamental_sources.py"
      - "nse_shareholding.py"
      - "research_free_fundamental_validation.py"
      - ".github/workflows/research-free-fundamental-validation.yml"

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run bounded live public-source validation
        run: python -u research_free_fundamental_validation.py

      - name: Upload research diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: research-free-fundamental-validation
          path: outputs/research_free_fundamental_validation/
          if-no-files-found: warn
