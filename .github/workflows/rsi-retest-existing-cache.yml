name: RSI Retest Backtest Using Existing NSE Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore existing NSE V8 cache only (no new cache save)
        uses: actions/cache/restore@v5
        with:
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/universe/
            data/inputs/fundamental_metrics.csv
            data/inputs/fundamental_thresholds.json
          key: nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install local analysis dependency
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Run regression tests
        run: python -m pytest -q test_rsi_retest_existing_cache.py

      - name: Report restored cache coverage
        if: always()
        run: |
          echo "===== RESTORED PRICE CACHE ====="
          find data/bhavcopy -maxdepth 1 -type f -name 'bhavcopy_*.csv' 2>/dev/null | sort | tee /tmp/price_files.txt || true
          echo "Price files: $(wc -l < /tmp/price_files.txt)"
          echo "===== RESTORED DELIVERY CACHE ====="
          find data/cache/delivery -maxdepth 1 -type f -name 'sec_bhavdata_full_*.csv' 2>/dev/null | sort | tee /tmp/delivery_files.txt || true
          echo "Delivery files: $(wc -l < /tmp/delivery_files.txt)"

      - name: Run RSI 30/40/50 retest comparison on cache only
        if: always()
        run: python rsi_retest_existing_cache.py

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-retest-existing-cache-report
          path: |
            outputs/rsi_retest_existing_cache/
            /tmp/price_files.txt
            /tmp/delivery_files.txt
          if-no-files-found: warn
          retention-days: 14
