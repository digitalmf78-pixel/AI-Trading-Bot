name: Track 2 Full Mainboard Offline Validation

on:
  push:
    branches:
      - audit/implementation-roadmap-2026-11-10
    paths:
      - ".github/workflows/track2-offline-validation.yml"
      - "scripts/track2_offline_validation.py"

permissions:
  contents: read
  actions: read

jobs:
  offline-track2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5

      - name: Restore existing NSE cache read-only
        uses: actions/cache/restore@v5
        with:
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/sector_constituents/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
            data/inputs/fundamental_metrics.csv
            data/cache/fundamental_history/
            data/cache/xbrl_samples/
            data/cache/xbrl_period_pairs/
            outputs/v8_official_financial_results_filings.csv
          key: track2-offline-\${{ runner.os }}-\${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-Linux-main-

      - name: Download fixed 09-Nov EOD artifact
        uses: actions/download-artifact@v6
        with:
          name: nse-v8-reports-42634890331
          repository: digitalmf78-pixel/AI-Trading-Bot
          run-id: 42634890331
          github-token: \${{ github.token }}
          path: artifact

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install offline validation dependencies
        run: python -m pip install --upgrade pip pandas requests yfinance

      - name: Run Track 2 only (no NSE fetch / no Telegram)
        run: python -u scripts/track2_offline_validation.py

      - name: Upload Track 2-only reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: track2-full-mainboard-offline-\${{ github.run_id }}
          path: outputs/track2_full_mainboard/
          if-no-files-found: warn
