name: Delivery A/B Historical Backtest (Research Only)

on:
  pull_request:
    paths:
      - "rvol_strategy_backtest.py"
      - "rsi_retest_existing_cache.py"
      - "test_rvol_strategy_backtest.py"
      - "delivery_history_backfill.py"
      - "test_delivery_history_backfill.py"\n      - "technical_momentum_backtest.py"\n      - "test_technical_momentum_backtest.py"
      - ".github/workflows/rvol-historical-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rvol-historical-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-backtest:
    name: Backtest Delivery A/B cohorts on restored 200-session NSE cache
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5

      - name: Restore and persist NSE Bhavcopy and Delivery cache
        uses: actions/cache@v5
        with:
          # Keep this path list identical to nse-test-scheduled.yml so the
          # Actions cache version matches the cache saved by the NSE scan.
          path: |
            data/bhavcopy/
            data/cache/delivery/
            data/cache/sector_index_daily/
            data/cache/sector_constituents/
            data/cache/universe/
            data/inputs/sector_map.csv
            data/inputs/sector_history.csv
            data/inputs/fundamental_metrics.csv
            data/cache/fundamental_history/
            data/cache/xbrl_samples/
            data/cache/xbrl_period_pairs/
            outputs/v8_official_financial_results_filings.csv
          key: nse-bhavcopy-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-bhavcopy-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            nse-bhavcopy-${{ runner.os }}-main-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest requests

      - name: Inventory restored historical cache
        shell: bash
        run: |
          set -euo pipefail
          PRICE_COUNT=$(find data/bhavcopy -maxdepth 1 -type f -name 'bhavcopy_????????.csv' 2>/dev/null | wc -l || true)
          DELIVERY_COUNT=$(find data/cache/delivery -maxdepth 1 -type f -name 'sec_bhavdata_full_????????.csv' 2>/dev/null | wc -l || true)
          echo "PRICE_CACHE_FILES=$PRICE_COUNT"
          echo "DELIVERY_CACHE_FILES_BEFORE_BACKFILL=$DELIVERY_COUNT"
          echo "===== EXISTING PRICE CACHE DATE RANGE ====="
          find data/bhavcopy -maxdepth 1 -type f -name 'bhavcopy_????????.csv' -printf '%f\n' 2>/dev/null | sort | { head -1; tail -1; } || true
          if [ "$PRICE_COUNT" -lt 200 ]; then
            echo "::error::Existing Bhavcopy cache has fewer than 200 dates. Backfill will not download or alter price files."
            exit 1
          fi

      - name: Test Delivery history backfill
        run: python -m pytest -q test_delivery_history_backfill.py

      - name: Backfill Delivery reports for existing 200 Bhavcopy sessions
        run: |
          set -euo pipefail
          python -u delivery_history_backfill.py --sessions 200
          echo "===== DELIVERY BACKFILL SUMMARY ====="
          cat outputs/delivery_history_backfill/summary.json
          echo "===== DELIVERY BACKFILL COVERAGE ====="
          cat outputs/delivery_history_backfill/coverage.csv

      - name: Run Delivery A/B backtest unit tests
        run: python -m pytest -q test_rvol_strategy_backtest.py

      - name: Run Delivery A/B 5D/10D/20D backtest (cache only)
        run: |
          set -euo pipefail
          python -u rvol_strategy_backtest.py
          echo "===== DELIVERY A/B COHORT COMPARISON ====="
          cat outputs/rvol_strategy_backtest/comparison.csv
          echo "===== CACHE COVERAGE ====="
          cat outputs/rvol_strategy_backtest/cache_coverage.csv
          echo "===== DELIVERY A/B REJECTION COUNTS ====="
          cat outputs/rvol_strategy_backtest/rejection_counts.csv
          echo "===== SIGNAL SAMPLE ====="
          head -11 outputs/rvol_strategy_backtest/signals.csv

      - name: Test technical momentum feature calculations\n        run: python -m pytest -q test_technical_momentum_backtest.py\n\n      - name: Run technical momentum and VCP backtest (cache only)\n        run: |\n          set -euo pipefail\n          python -u technical_momentum_backtest.py\n          echo "===== TECHNICAL MOMENTUM COMPARISON ====="\n          cat outputs/technical_momentum_backtest/comparison.csv\n          echo "===== TECHNICAL CACHE COVERAGE ====="\n          cat outputs/technical_momentum_backtest/cache_coverage.csv\n\n      - name: Upload historical Delivery A/B backtest reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: delivery-ab-historical-backtest-${{ github.run_id }}
          path: |
            outputs/rvol_strategy_backtest/
            outputs/delivery_history_backfill/\n            outputs/technical_momentum_backtest/
          if-no-files-found: warn
          retention-days: 30
