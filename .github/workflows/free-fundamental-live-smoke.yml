name: Free Fundamentals Live Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - "free_fundamental_sources.py"
      - "free_fundamental_live_smoke.py"
      - ".github/workflows/free-fundamental-live-smoke.yml"
  push:
    branches: [main]
    paths:
      - "free_fundamental_sources.py"
      - "free_fundamental_live_smoke.py"
      - ".github/workflows/free-fundamental-live-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install free-source dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Check Moneycontrol and Tickertape live public-data coverage
        run: python -u free_fundamental_live_smoke.py

      - name: Upload live source diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: free-fundamental-live-smoke
          path: |
            outputs/free_fundamental_live_smoke.csv
            outputs/free_fundamental_live_smoke_summary.json
          if-no-files-found: warn
